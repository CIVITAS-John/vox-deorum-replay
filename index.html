<html>

<head>
	<meta charset="utf-8" />
	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
		rel="stylesheet">

	<!-- Vendors -->
	<link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
	<link href="vendor/bootstrap-slider/css/bootstrap-slider.min.css" rel="stylesheet" />
	<link href="vendor/selectpicker/css/bootstrap-select.min.css" rel="stylesheet" />
	<link href="vendor/leaflet/leaflet.css" rel="stylesheet" />
	<link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.4.0/css/font-awesome.min.css" rel="stylesheet">

	<!-- Ours -->
	<link href="assets/main.css" rel="stylesheet" />
</head>

<body>
	<div class="textures">
		<!-- Terrain -->
		<img id="GRASSLAND" src="./assets/tiles/GRASSLAND.png" crossOrigin="Anonymous">
		<img id="PLAINS" src="./assets/tiles/PLAINS.png" crossOrigin="Anonymous">
		<img id="DESERT" src="./assets/tiles/DESERT.png" crossOrigin="Anonymous">
		<img id="TUNDRA" src="./assets/tiles/TUNDRA.png" crossOrigin="Anonymous">
		<img id="SNOW" src="./assets/tiles/SNOW.png" crossOrigin="Anonymous">
		<img id="COAST" src="./assets/tiles/COAST.png" crossOrigin="Anonymous">
		<img id="OCEAN" src="./assets/tiles/OCEAN.png" crossOrigin="Anonymous">

		<!-- Elevation -->
		<img id="MOUNTAIN" src="./assets/tiles/MOUNTAIN.png" crossOrigin="Anonymous">
		<img id="HILLS" src="./assets/tiles/HILLS.png" crossOrigin="Anonymous">

		<!-- Features -->
		<img id="ICE" src="./assets/tiles/ICE.png" crossOrigin="Anonymous">
		<img id="JUNGLE" src="./assets/tiles/JUNGLE.png" crossOrigin="Anonymous">
		<!-- <img id="MARSH"        src="./assets/tiles/MARSH.png"        crossOrigin="Anonymous"> -->
		<!-- <img id="OASIS"        src="./assets/tiles/OASIS.png"        crossOrigin="Anonymous"> -->
		<!-- <img id="FLOOD_PLAINS" src="./assets/tiles/FLOOD_PLAINS.png" crossOrigin="Anonymous"> -->
		<img id="FOREST" src="./assets/tiles/FOREST.png" crossOrigin="Anonymous">
	</div>

	<h2 class="page-header-area">Civilization V (<a href="https://github.com/LoneGazebo/Community-Patch-DLL"
			target="_blank">Community Patch/Vox Populi</a>) Replay Viewer</h2>

	<div class="main-container">
		<div class="top-bar">
			<div class="top-left-corner"></div>

			<div class="top-left">
				<button id="playPause" class="btn btn-primary"><i class="fa fa-play"></i></button>
				<input id="speedSlider" type="text" />
			</div>

			<div class="top-left-split"></div>

			<div class="top-middle">
				<input id="turnSlider" type="text" />
			</div>

			<div class="top-right-split"></div>

			<div class="top-right">
				<select id="event-select" class="selectpicker" multiple data-selected-text-format="count">
					<option value="MESSAGE">Messages </option>
					<option value="CITY_FOUNDED">New cities </option>
					<option value="CITIES_TRANSFERRED">City transfers</option>
					<option value="CITY_RAZED">City razings </option>
					<option value="PANTHEON_SELECTED">Pantheons </option>
					<option value="RELIGION_FOUNDED">Religions </option>
					<option value="TILES_CLAIMED">Tile claims </option>
				</select>
			</div>

			<div class="top-right-corner flipped"></div>
		</div>

		<div class="border left-border"></div>

		<div class="map-container">
			<div class="map"></div>
		</div>

		<div class="border split-border"></div>

		<div class="log-container">
			<ul class="log-messages"></ul>
		</div>

		<div class="border right-border flipped"></div>

		<div class="bottom-border">
			<div class="bottom-left-corner"></div>
			<div class="bottom-left"></div>
			<div class="bottom-middle"></div>
			<div class="bottom-right"></div>
			<div class="bottom-right-corner flipped"></div>
		</div>
	</div>

	<div class="disclaimer">
		MIT License. <a href="https://civitas-john.github.io/">John Chen (2025)</a>. Based on Alex Webb's <a
			href="https://github.com/aiwebb/civ5replay">civ5replay</a>.

		and originated from their game
		<a href="http://www.civilization5.com/" target="_blank">Civilization V</a>.
		Special thanks to
		<a href="https://github.com/LoneGazebo/Community-Patch-DLL" target="_blank">the Vox Populi Team</a>,
		which keeps Civ V alive to this date.
	</div>

	<!-- General -->
	<script src="./vendor/lodash.js" type="text/javascript"></script>
	<script src="./vendor/jquery.js" type="text/javascript"></script>
	<script src="./vendor/bootstrap/js/bootstrap.js" type="text/javascript"></script>
	<script src="./vendor/bootstrap-slider/bootstrap-slider.min.js" type="text/javascript"></script>
	<script src="./vendor/selectpicker/js/bootstrap-select.min.js" type="text/javascript"></script>

	<!-- File parsing -->
	<script src="./vendor/jdataview.js" type="text/javascript"></script>

	<!-- Mapping -->
	<script src="./vendor/leaflet/leaflet.js" type="text/javascript"></script>

	<!-- App code -->
	<script src="./scripts/config/civ-colors.js" type="text/javascript"></script>
	<script src="./scripts/core/binary-parser.js" type="text/javascript"></script>
	<script src="./scripts/map/hex-layer.js" type="text/javascript"></script>
	<script src="./scripts/map/map.js" type="text/javascript"></script>
	<script src="./scripts/core/replay.js" type="text/javascript"></script>
	<script src="./scripts/core/replay-viewer.js" type="text/javascript"></script>
	<script src="./scripts/ui/event-log.js" type="text/javascript"></script>
	<script src="./scripts/ui/control-bar.js" type="text/javascript"></script>
	<script src="./scripts/main.js" type="text/javascript"></script>
</body>

</html>
